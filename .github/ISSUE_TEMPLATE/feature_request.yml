name: Feature Request
description: Suggest a new feature for KeChat
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide as much detail as possible.

  - type: dropdown
    id: feature-area
    attributes:
      label: Feature Area
      description: Which part of KeChat is this feature for?
      options:
        - Messaging (real-time chat, E2E encryption)
        - Payments (M-Pesa, Airtel Money, wallet)
        - Calls (voice/video calling)
        - Marketplace (SME storefront)
        - Mini-apps (developer platform)
        - Authentication (phone OTP, eCitizen)
        - Community (channels, moderation)
        - Admin Dashboard
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "I would like to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or features you've considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups about the feature request.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Low - Nice to have
        - Medium - Would improve user experience
        - High - Critical for core functionality
    validations:
      required: true
