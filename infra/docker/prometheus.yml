global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kechat-services'
    static_configs:
      - targets: 
        - 'auth-service:3001'
        - 'messaging-service:3002'
        - 'payments-service:3003'
        - 'calls-service:3004'
        - 'marketplace-service:3005'
        - 'integrations-service:3006'
        - 'miniapps-service:3007'
    labels:
      environment: 'development'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
